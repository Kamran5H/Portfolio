<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description"><title id="title">Early Coding Archive — workflow study</title><desc id="description">Illustrative pseudocode, not a runnable model or a claimed prediction result.</desc><rect width="1200" height="800" fill="#f6f4ed"/><path d="M48 45h1104" stroke="#c8cec3"/><text x="48" y="78" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">MUHAMMAD KAMRAN ASHRAF / PROJECT NOTEBOOK</tspan></text><text x="48" y="133" fill="#283b37" font-size="39" font-family="Arial, sans-serif"><tspan x="48" dy="0">Early Coding Archive</tspan></text><text x="48" y="210" fill="#52635f" font-size="18" font-family="Arial, sans-serif"><tspan x="48" dy="0">An archive of first experiments</tspan></text><g><rect x="48" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="72" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="72" dy="0">01 / Interfaces</tspan></text><text x="72" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="72" dy="0">Learning through useful</tspan><tspan x="72" dy="34.5">tools</tspan></text><text x="72" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="72" dy="0">The archive includes early Python</tspan><tspan x="72" dy="22.5">and Tkinter interface experiments.</tspan></text><path d="M72 520h308" stroke="#c8cec3"/><text x="72" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="72" dy="0">window = create_interface() • inputs =</tspan><tspan x="72" dy="19.5">collect_values() •</tspan><tspan x="72" dy="19.5">display_result(inputs)</tspan></text></g><g><rect x="422" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="446" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="446" dy="0">02 / Modelling</tspan></text><text x="446" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="446" dy="0">A first modelling</tspan><tspan x="446" dy="34.5">question</tspan></text><text x="446" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="446" dy="0">A boiling-point model connects</tspan><tspan x="446" dy="22.5">introductory programming with a</tspan><tspan x="446" dy="22.5">chemistry problem.</tspan></text><path d="M446 520h308" stroke="#c8cec3"/><text x="446" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="446" dy="0">features → training data • model →</tspan><tspan x="446" dy="19.5">estimated boiling point • validation →</tspan><tspan x="446" dy="19.5">inspect prediction error</tspan></text></g><g><rect x="796" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="820" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="820" dy="0">03 / Archive</tspan></text><text x="820" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="820" dy="0">Make the learning</tspan><tspan x="820" dy="34.5">visible</tspan></text><text x="820" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="820" dy="0">The repository preserves early</tspan><tspan x="820" dy="22.5">implementations as a record of</tspan><tspan x="820" dy="22.5">technical development.</tspan></text><path d="M820 520h308" stroke="#c8cec3"/><text x="820" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="820" dy="0">Python fundamentals • Tkinter</tspan><tspan x="820" dy="19.5">interfaces • Introductory machine</tspan><tspan x="820" dy="19.5">learning</tspan></text></g><text x="48" y="718" fill="#52635f" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">Illustrative workflow study · Sample content · Not an application screenshot</tspan></text><text x="48" y="747" fill="#246356" font-size="13" font-family="Arial, sans-serif"><tspan x="48" dy="0">https://github.com/Kamran5H/Early-Coding-Archive</tspan></text><text x="48" y="775" fill="#52635f" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">kamranashraf.is-a.dev</tspan></text></svg>