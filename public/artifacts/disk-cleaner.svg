<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description"><title id="title">Disk Cleaner Pro — workflow study</title><desc id="description">Sample paths and sizes only. No local files are scanned or deleted by this preview.</desc><rect width="1200" height="800" fill="#f6f4ed"/><path d="M48 45h1104" stroke="#c8cec3"/><text x="48" y="78" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">MUHAMMAD KAMRAN ASHRAF / PROJECT NOTEBOOK</tspan></text><text x="48" y="133" fill="#283b37" font-size="39" font-family="Arial, sans-serif"><tspan x="48" dy="0">Disk Cleaner Pro</tspan></text><text x="48" y="210" fill="#52635f" font-size="18" font-family="Arial, sans-serif"><tspan x="48" dy="0">Inspect duplicates before cleanup</tspan></text><g><rect x="48" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="72" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="72" dy="0">01 / Discover</tspan></text><text x="72" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="72" dy="0">Find candidate</tspan><tspan x="72" dy="34.5">duplicates</tspan></text><text x="72" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="72" dy="0">The Windows utility helps discover</tspan><tspan x="72" dy="22.5">duplicate files and disk-cleanup</tspan><tspan x="72" dy="22.5">candidates.</tspan></text><path d="M72 520h308" stroke="#c8cec3"/><text x="72" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="72" dy="0">notes.pdf / Sample folder A •</tspan><tspan x="72" dy="19.5">notes-copy.pdf / Sample folder B •</tspan><tspan x="72" dy="19.5">image.png / Sample folder C</tspan></text></g><g><rect x="422" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="446" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="446" dy="0">02 / Compare</tspan></text><text x="446" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="446" dy="0">Compare before deciding</tspan></text><text x="446" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="446" dy="0">A duplicate review should retain</tspan><tspan x="446" dy="22.5">the file context needed for a</tspan><tspan x="446" dy="22.5">deliberate decision.</tspan></text><path d="M446 520h308" stroke="#c8cec3"/><text x="446" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="446" dy="0">Group A / Two sample documents •</tspan><tspan x="446" dy="19.5">Original path / Review location •</tspan><tspan x="446" dy="19.5">Candidate copy / Inspect before removal</tspan></text></g><g><rect x="796" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="820" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="820" dy="0">03 / Review</tspan></text><text x="820" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="820" dy="0">Keep cleanup intentional</tspan></text><text x="820" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="820" dy="0">Use the actual application for</tspan><tspan x="820" dy="22.5">supported scans and cleanup. The</tspan><tspan x="820" dy="22.5">portfolio only explains the</tspan><tspan x="820" dy="22.5">workflow.</tspan></text><path d="M820 520h308" stroke="#c8cec3"/><text x="820" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="820" dy="0">Confirm which copy to retain • Review</tspan><tspan x="820" dy="19.5">the proposed selection • Keep backups</tspan><tspan x="820" dy="19.5">of important files</tspan></text></g><text x="48" y="718" fill="#52635f" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">Illustrative workflow study · Sample content · Not an application screenshot</tspan></text><text x="48" y="747" fill="#246356" font-size="13" font-family="Arial, sans-serif"><tspan x="48" dy="0">https://github.com/Kamran5H/DiskOptimizerPro</tspan></text><text x="48" y="775" fill="#52635f" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">kamranashraf.is-a.dev</tspan></text></svg>