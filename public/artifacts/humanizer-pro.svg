<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description"><title id="title">Humanizer Pro — workflow study</title><desc id="description">An illustrative writing workflow. No language model is called, no detector score is claimed, and no document is uploaded.</desc><rect width="1200" height="800" fill="#f6f4ed"/><path d="M48 45h1104" stroke="#c8cec3"/><text x="48" y="78" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">MUHAMMAD KAMRAN ASHRAF / PROJECT NOTEBOOK</tspan></text><text x="48" y="133" fill="#283b37" font-size="39" font-family="Arial, sans-serif"><tspan x="48" dy="0">Humanizer Pro</tspan></text><text x="48" y="210" fill="#52635f" font-size="18" font-family="Arial, sans-serif"><tspan x="48" dy="0">A workspace for considered revision</tspan></text><g><rect x="48" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="72" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="72" dy="0">01 / Read</tspan></text><text x="72" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="72" dy="0">Start with the intended</tspan><tspan x="72" dy="34.5">meaning</tspan></text><text x="72" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="72" dy="0">The text-editing experiment</tspan><tspan x="72" dy="22.5">combines document processing and</tspan><tspan x="72" dy="22.5">configurable language-model</tspan><tspan x="72" dy="22.5">providers.</tspan></text><path d="M72 520h308" stroke="#c8cec3"/><text x="72" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="72" dy="0">Draft / The experiment was repeated. •</tspan><tspan x="72" dy="19.5">Question / What needs to be clearer? •</tspan><tspan x="72" dy="19.5">Aim / Preserve meaning while revising</tspan></text></g><g><rect x="422" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="446" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="446" dy="0">02 / Revise</tspan></text><text x="446" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="446" dy="0">A clearer sample</tspan><tspan x="446" dy="34.5">sentence</tspan></text><text x="446" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="446" dy="0">A useful edit makes the intended</tspan><tspan x="446" dy="22.5">action and context easier to</tspan><tspan x="446" dy="22.5">understand.</tspan></text><path d="M446 520h308" stroke="#c8cec3"/><text x="446" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="446" dy="0">Revision / We repeated the experiment.</tspan><tspan x="446" dy="19.5">• Change / A direct, explicit subject •</tspan><tspan x="446" dy="19.5">Review / Check that the meaning is</tspan><tspan x="446" dy="19.5">accurate</tspan></text></g><g><rect x="796" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="820" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="820" dy="0">03 / Document</tspan></text><text x="820" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="820" dy="0">Keep the final review</tspan><tspan x="820" dy="34.5">human</tspan></text><text x="820" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="820" dy="0">Provider configuration determines</tspan><tspan x="820" dy="22.5">where text is processed.</tspan><tspan x="820" dy="22.5">Researchers remain responsible for</tspan><tspan x="820" dy="22.5">accuracy and authorship.</tspan></text><path d="M820 520h308" stroke="#c8cec3"/><text x="820" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="820" dy="0">Document / DOCX handling • Provider /</tspan><tspan x="820" dy="19.5">Configurable services • Final step /</tspan><tspan x="820" dy="19.5">Review every change</tspan></text></g><text x="48" y="718" fill="#52635f" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">Illustrative workflow study · Sample content · Not an application screenshot</tspan></text><text x="48" y="747" fill="#246356" font-size="13" font-family="Arial, sans-serif"><tspan x="48" dy="0">https://github.com/Kamran5H/Humanizer</tspan></text><text x="48" y="775" fill="#52635f" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">kamranashraf.is-a.dev</tspan></text></svg>