<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description"><title id="title">Source Genius Extension — workflow study</title><desc id="description">Illustrative MV3 side panel; it does not inspect your tabs or collect page content.</desc><rect width="1200" height="800" fill="#f6f4ed"/><path d="M48 45h1104" stroke="#c8cec3"/><text x="48" y="78" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">MUHAMMAD KAMRAN ASHRAF / PROJECT NOTEBOOK</tspan></text><text x="48" y="133" fill="#283b37" font-size="39" font-family="Arial, sans-serif"><tspan x="48" dy="0">Source Genius Extension</tspan></text><text x="48" y="210" fill="#52635f" font-size="18" font-family="Arial, sans-serif"><tspan x="48" dy="0">Research beside the browser page</tspan></text><g><rect x="48" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="72" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="72" dy="0">01 / Context</tspan></text><text x="72" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="72" dy="0">Keep the page in view</tspan></text><text x="72" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="72" dy="0">The Chrome extension provides a</tspan><tspan x="72" dy="22.5">side-panel interface for the Source</tspan><tspan x="72" dy="22.5">Genius workflow.</tspan></text><path d="M72 520h308" stroke="#c8cec3"/><text x="72" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="72" dy="0">Current page / Sample product • Side</tspan><tspan x="72" dy="19.5">panel / Source Genius • Context /</tspan><tspan x="72" dy="19.5">Product information</tspan></text></g><g><rect x="422" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="446" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="446" dy="0">02 / Review</tspan></text><text x="446" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="446" dy="0">Compare candidate leads</tspan></text><text x="446" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="446" dy="0">Candidate brand sources can be</tspan><tspan x="446" dy="22.5">reviewed without losing the</tspan><tspan x="446" dy="22.5">original page context.</tspan></text><path d="M446 520h308" stroke="#c8cec3"/><text x="446" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="446" dy="0">Product clue • Candidate website •</tspan><tspan x="446" dy="19.5">Manual verification</tspan></text></g><g><rect x="796" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="820" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="820" dy="0">03 / Continue</tspan></text><text x="820" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="820" dy="0">A compact browser</tspan><tspan x="820" dy="34.5">companion</tspan></text><text x="820" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="820" dy="0">The extension is the front-end; see</tspan><tspan x="820" dy="22.5">the repository for its current</tspan><tspan x="820" dy="22.5">setup and integration requirements.</tspan></text><path d="M820 520h308" stroke="#c8cec3"/><text x="820" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="820" dy="0">Manifest V3 • Side-panel interface •</tspan><tspan x="820" dy="19.5">Source Genius integration</tspan></text></g><text x="48" y="718" fill="#52635f" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">Illustrative workflow study · Sample content · Not an application screenshot</tspan></text><text x="48" y="747" fill="#246356" font-size="13" font-family="Arial, sans-serif"><tspan x="48" dy="0">https://github.com/Kamran5H/SourceGenius-Extension</tspan></text><text 