<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description"><title id="title">Gmail Zenith — workflow study</title><desc id="description">Fictional messages and rules. This preview never connects to Gmail or modifies an inbox.</desc><rect width="1200" height="800" fill="#f6f4ed"/><path d="M48 45h1104" stroke="#c8cec3"/><text x="48" y="78" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">MUHAMMAD KAMRAN ASHRAF / PROJECT NOTEBOOK</tspan></text><text x="48" y="133" fill="#283b37" font-size="39" font-family="Arial, sans-serif"><tspan x="48" dy="0">Gmail Zenith</tspan></text><text x="48" y="210" fill="#52635f" font-size="18" font-family="Arial, sans-serif"><tspan x="48" dy="0">Give inbox rules a clear structure</tspan></text><g><rect x="48" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="72" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="72" dy="0">01 / Inbox</tspan></text><text x="72" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="72" dy="0">A reviewable inbox</tspan><tspan x="72" dy="34.5">sample</tspan></text><text x="72" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="72" dy="0">Rule-based triage starts with a</tspan><tspan x="72" dy="22.5">clear understanding of incoming</tspan><tspan x="72" dy="22.5">messages.</tspan></text><path d="M72 520h308" stroke="#c8cec3"/><text x="72" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="72" dy="0">Sample newsletter / Weekly digest •</tspan><tspan x="72" dy="19.5">Sample invitation / Research meeting •</tspan><tspan x="72" dy="19.5">Sample receipt / Order confirmation</tspan></text></g><g><rect x="422" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="446" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="446" dy="0">02 / Rules</tspan></text><text x="446" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="446" dy="0">Turn intent into a rule</tspan></text><text x="446" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="446" dy="0">The application uses the official</tspan><tspan x="446" dy="22.5">Gmail API for its configured</tspan><tspan x="446" dy="22.5">automation.</tspan></text><path d="M446 520h308" stroke="#c8cec3"/><text x="446" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="446" dy="0">if category == newsletter: • propose:</tspan><tspan x="446" dy="19.5">archive • else: keep for review</tspan></text></g><g><rect x="796" y="240" width="356" height="430" rx="6" fill="#fffcf5" stroke="#c8cec3"/><text x="820" y="279" fill="#246356" font-size="12" font-family="Arial, sans-serif"><tspan x="820" dy="0">03 / Triage</tspan></text><text x="820" y="321" fill="#283b37" font-size="23" font-family="Arial, sans-serif"><tspan x="820" dy="0">See the intended</tspan><tspan x="820" dy="34.5">destinations</tspan></text><text x="820" y="410" fill="#52635f" font-size="15" font-family="Arial, sans-serif"><tspan x="820" dy="0">Rules and access scopes should be</tspan><tspan x="820" dy="22.5">reviewed in the real application</tspan><tspan x="820" dy="22.5">before applying mailbox changes.</tspan></text><path d="M820 520h308" stroke="#c8cec3"/><text x="820" y="552" fill="#52635f" font-size="13" font-family="Arial, sans-serif"><tspan x="820" dy="0">Weekly digest → Archive candidate •</tspan><tspan x="820" dy="19.5">Research meeting → Keep • Order</tspan><tspan x="820" dy="19.5">confirmation → Review</tspan></text></g><text x="48" y="718" fill="#52635f" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">Illustrative workflow study · Sample content · Not an application screenshot</tspan></text><text x="48" y="747" fill="#246356" font-size="13" font-family="Arial, sans-serif"><tspan x="48" dy="0">https://github.com/Kamran5H/GmailZenith</tspan></text><text x="48" y="775" fill="#52635f" font-size="12" font-family="Arial, sans-serif"><tspan x="48" dy="0">kamranashraf.is-a.dev</tspan></text></svg>